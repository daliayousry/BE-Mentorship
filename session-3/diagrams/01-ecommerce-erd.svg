<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="Menlo, Consolas, monospace" font-size="13">
  <rect x="0" y="0" width="1060" height="560" fill="#ffffff"/>

  <!-- ===== relationship lines (drawn first, under the boxes) ===== -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <!-- category 1 — N product -->
    <line x1="260" y1="100" x2="420" y2="100"/>
    <line x1="272" y1="92" x2="272" y2="108"/> <!-- one tick -->
    <path d="M405 100 L420 92 M405 100 L420 100 M405 100 L420 108"/> <!-- crow's foot -->

    <!-- customer 1 — N orders -->
    <line x1="280" y1="432" x2="420" y2="432"/>
    <line x1="292" y1="424" x2="292" y2="440"/>
    <path d="M405 432 L420 424 M405 432 L420 432 M405 432 L420 440"/>

    <!-- orders 1 — N order_details -->
    <path d="M640 432 L715 432 L715 340 L780 340"/>
    <line x1="652" y1="424" x2="652" y2="440"/>
    <path d="M765 340 L780 332 M765 340 L780 340 M765 340 L780 348"/>

    <!-- product 1 — N order_details -->
    <path d="M640 120 L905 120 L905 250"/>
    <line x1="652" y1="112" x2="652" y2="128"/>
    <path d="M905 235 L897 250 M905 235 L905 250 M905 235 L913 250"/>
  </g>

  <!-- cardinality labels -->
  <g fill="#475569" font-size="12" font-family="Helvetica, Arial, sans-serif">
    <text x="285" y="92">1</text>
    <text x="392" y="92">N</text>
    <text x="305" y="424">1</text>
    <text x="392" y="424">N</text>
    <text x="665" y="424">1</text>
    <text x="725" y="332">N</text>
    <text x="665" y="112">1</text>
    <text x="915" y="244">N</text>
    <text x="300" y="118" font-style="italic">contains</text>
    <text x="320" y="450" font-style="italic">places</text>
    <text x="668" y="460" font-style="italic">has lines</text>
    <text x="700" y="112" font-style="italic">appears in</text>
  </g>

  <!-- ===== CATEGORY ===== -->
  <g>
    <rect x="60" y="60" width="200" height="80" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="60" y="60" width="200" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="160" y="79" text-anchor="middle" font-weight="bold" fill="#1e3a8a">category</text>
    <text x="72" y="108" fill="#0f172a" font-weight="bold" text-decoration="underline">category_id</text>
    <text x="200" y="108" fill="#64748b" font-size="11">PK</text>
    <text x="72" y="130" fill="#0f172a">category_name</text>
  </g>

  <!-- ===== PRODUCT ===== -->
  <g>
    <rect x="420" y="40" width="220" height="168" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="420" y="40" width="220" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="530" y="59" text-anchor="middle" font-weight="bold" fill="#1e3a8a">product</text>
    <text x="432" y="88" fill="#0f172a" font-weight="bold" text-decoration="underline">product_id</text>
    <text x="600" y="88" fill="#64748b" font-size="11">PK</text>
    <text x="432" y="110" fill="#0f172a">category_id</text>
    <text x="600" y="110" fill="#64748b" font-size="11">FK</text>
    <text x="432" y="132" fill="#0f172a">name</text>
    <text x="432" y="154" fill="#0f172a">description</text>
    <text x="432" y="176" fill="#0f172a">price</text>
    <text x="432" y="198" fill="#0f172a">stock_quantity</text>
  </g>

  <!-- ===== CUSTOMER ===== -->
  <g>
    <rect x="60" y="360" width="220" height="146" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="60" y="360" width="220" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="170" y="379" text-anchor="middle" font-weight="bold" fill="#1e3a8a">customer</text>
    <text x="72" y="408" fill="#0f172a" font-weight="bold" text-decoration="underline">customer_id</text>
    <text x="240" y="408" fill="#64748b" font-size="11">PK</text>
    <text x="72" y="430" fill="#0f172a">first_name</text>
    <text x="72" y="452" fill="#0f172a">last_name</text>
    <text x="72" y="474" fill="#0f172a">email</text>
    <text x="72" y="496" fill="#0f172a">password</text>
  </g>

  <!-- ===== ORDERS ===== -->
  <g>
    <rect x="420" y="370" width="220" height="124" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="420" y="370" width="220" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="530" y="389" text-anchor="middle" font-weight="bold" fill="#1e3a8a">orders</text>
    <text x="432" y="418" fill="#0f172a" font-weight="bold" text-decoration="underline">order_id</text>
    <text x="600" y="418" fill="#64748b" font-size="11">PK</text>
    <text x="432" y="440" fill="#0f172a">customer_id</text>
    <text x="600" y="440" fill="#64748b" font-size="11">FK</text>
    <text x="432" y="462" fill="#0f172a">order_date</text>
    <text x="432" y="484" fill="#0f172a">total_amount</text>
  </g>

  <!-- ===== ORDER_DETAILS ===== -->
  <g>
    <rect x="780" y="250" width="240" height="146" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="780" y="250" width="240" height="28" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="900" y="269" text-anchor="middle" font-weight="bold" fill="#1e3a8a">order_details</text>
    <text x="792" y="298" fill="#0f172a" font-weight="bold" text-decoration="underline">order_detail_id</text>
    <text x="980" y="298" fill="#64748b" font-size="11">PK</text>
    <text x="792" y="320" fill="#0f172a">order_id</text>
    <text x="980" y="320" fill="#64748b" font-size="11">FK</text>
    <text x="792" y="342" fill="#0f172a">product_id</text>
    <text x="980" y="342" fill="#64748b" font-size="11">FK</text>
    <text x="792" y="364" fill="#0f172a">quantity</text>
    <text x="792" y="386" fill="#0f172a">unit_price</text>
  </g>
</svg>
